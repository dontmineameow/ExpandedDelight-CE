      components:
        minecraft:max_stack_size: 16
        minecraft:use_remainder:
          id: minecraft:glass_bottle
          count: 1
      food:
        nutrition: 3
        saturation: 0.6
        can-always-eat: true
  expandeddelight:bowl_food_template:
    material: cooked_beef
    model: ${__NAMESPACE__}:item/${__ID__}
    data:
      components:
        minecraft:max_stack_size: 16
        minecraft:use_remainder:
          id: minecraft:bowl
          count: 1

