templates:
  expandeddelight:item_template:
    model: ${__NAMESPACE__}:item/${__ID__}
  expandeddelight:drink_template:
    material: honey_bottle
    model: ${__NAMESPACE__}:item/${__ID__}
    data:
      components:
        minecraft:max_stack_size: 16
        minecraft:use_remainder:
          id: minecraft:glass_bottle
          count: 1
      food:
        nutrition: 1
        saturation: 1.2
        can-always-eat: true
  expandeddelight:jelly_template:
    material: honey_bottle
    model: ${__NAMESPACE__}:item/${__ID__}
