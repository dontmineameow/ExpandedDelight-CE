blocks:
  expandeddelight:asparagus_crop:
    settings:
      template:
        - default:hardness/none
        - default:sound/grass
      overrides:
        item: expandeddelight:asparagus_seeds
        push-reaction: destroy
        is-randomly-ticking: true
      tags:
        - minecraft:bee_growables
        - minecraft:crops
        - minecraft:maintains_farmland
    behaviors:
      - type: liquid_flowable_block
      - type: crop_block
        grow-speed: 0.25
        light-requirement: 9
        is-bone-meal-target: true
        bone_meal_age_bonus:
          type: uniform
          min: 1
          max: 3
      - type: bush_block
        bottom-blocks:
          - minecraft:farmland
          - farmersdelight:rich_soil_farmland
    states:
      properties:
        age:
          type: int
          default: 0
          range: 0~3
      appearances:
        age=0:
          auto_state:
            type: sugar_cane
            id: transparent
          transparent: true
          entity-renderer:
            item: expandeddelight:asparagus_crop_stage0
        age=1:
          auto_state:
            type: sugar_cane
            id: transparent
          transparent: true
          entity-renderer:
            item: expandeddelight:asparagus_crop_stage1
        age=2:
          auto_state:
            type: sugar_cane
            id: transparent
          transparent: true
          entity-renderer:
            item: expandeddelight:asparagus_crop_stage2
        age=3:
          auto_state:
            type: sugar_cane
            id: transparent
          transparent: true
          entity-renderer:
            item: expandeddelight:asparagus_crop_stage3
      variants:
        age=0:
          appearance: age=0
        age=1:
          appearance: age=1
        age=2:
          appearance: age=2
        age=3:
          appearance: age=3
    loot:
      functions:
        - type: explosion_decay
      pools:
        - rolls: 1
          entries:
            - type: alternatives
              children:
                - type: item
                  item: expandeddelight:asparagus
                  count: 1
                  conditions:
                    - type: match_block_property
                      properties:
                        age: 3
                - type: item
                  item: expandeddelight:asparagus_seeds
                  count: 1
                  conditions:
                    - type: inverted
                      term:
                        type: match_block_property
                        properties:
                          age: 3
        - rolls: 1
          conditions:
            - type: match_block_property
              properties:
                age: 3
          entries:
            - type: item
              item: expandeddelight:asparagus_seeds
              count: 1
              functions:
                - type: apply_bonus
                  enchantment: minecraft:fortune
                  formula:
                    type: binomial_with_bonus_count
                    extra: 3
                    probability: 0.5714286

